version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: math-verify-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: math_verify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
